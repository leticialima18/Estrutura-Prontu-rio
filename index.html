<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário Eletrônico</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1">Prontuário Eletrônico</span>
    </div>
</nav>

<div class="container mt-4">
<form onsubmit="mostrarDados(); return false;">

    <!-- Dados do Paciente -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Dados do Paciente
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nome</label>
                    <input id="nome" type="text" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Idade</label>
                    <input id="idade" type="text" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Sexo</label>
                    <select id="sexo" class="form-select">
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Sinais Vitais -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Sinais Vitais
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <input id="pressao" type="text" class="form-control" placeholder="Pressão">
                </div>
                <div class="col-md-3">
                    <input id="frequencia" type="number" class="form-control" placeholder="Frequência">
                </div>
                <div class="col-md-3">
                    <input id="temperatura" type="text" class="form-control" placeholder="Temperatura">
                </div>
                <div class="col-md-3">
                    <input id="saturacao" type="text" class="form-control" placeholder="Saturação">
                </div>
            </div>
        </div>
    </div>

    <!-- Evolução -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Evolução
        </div>
        <div class="card-body">
            <textarea id="evolucao" class="form-control" rows="4"></textarea>
        </div>
    </div>

    <!-- Medicação -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Medicação
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <input id="medicamento" type="text" class="form-control" placeholder="Medicamento">
                </div>
                <div class="col-md-4">
                    <input id="dosagem" type="text" class="form-control" placeholder="Dosagem">
                </div>
                <div class="col-md-4">
                    <input id="horario" type="text" class="form-control" placeholder="Horário">
                </div>
            </div>
        </div>
    </div>

    <!-- Botão -->
    <div class="text-end">
        <button class="btn btn-primary" type="submit">Salvar</button>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="alert alert-secondary mt-4 d-none"></div>

</form>
</div>

<!-- Toast -->
<div class="toast position-fixed bottom-0 end-0 p-3" id="toastSucesso">
    <div class="toast-header">
        <strong class="me-auto">Sistema</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
        Prontuário salvo com sucesso!
    </div>
</div>

<!-- Bootstrap JS (necessário para o toast funcionar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script -->
<script>
function mostrarDados() {
    let nome = document.getElementById("nome").value;
    let idade = document.getElementById("idade").value;
    let sexo = document.getElementById("sexo").value;
    let pressao = document.getElementById("pressao").value;
    let frequencia = document.getElementById("frequencia").value;
    let temperatura = document.getElementById("temperatura").value;
    let saturacao = document.getElementById("saturacao").value;
    let evolucao = document.getElementById("evolucao").value;
    let medicamento = document.getElementById("medicamento").value;
    let dosagem = document.getElementById("dosagem").value;
    let horario = document.getElementById("horario").value;

    let resultado = `
        <h5>Prontuário do Paciente</h5>
        <strong>Nome:</strong> ${nome} <br>
        <strong>Idade:</strong> ${idade} <br>
        <strong>Sexo:</strong> ${sexo} <br>
        <strong>Pressão:</strong> ${pressao} <br>
        <strong>Frequência:</strong> ${frequencia} <br>
        <strong>Temperatura:</strong> ${temperatura} <br>
        <strong>Saturação:</strong> ${saturacao} <br>
        <strong>Evolução:</strong> ${evolucao} <br>
        <strong>Medicamento:</strong> ${medicamento} <br>
        <strong>Dosagem:</strong> ${dosagem} <br>
        <strong>Horário:</strong> ${horario}
    `;

    let caixa = document.getElementById("resultado");
    caixa.innerHTML = resultado;
    caixa.classList.remove("d-none");

    let toast = new bootstrap.Toast(document.getElementById('toastSucesso'), {
        delay: 3000
    });
    toast.show();
}
</script>

</body>
</html>
