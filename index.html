<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário Eletrônico - Estrutura</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1">Prontuário Eletrônico</span>
    </div>
</nav>

<div class="container mt-4">
<form>

    <!-- Dados do Paciente -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Dados do Paciente
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" placeholder="Digite o nome">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Idade</label>
                    <input type="text" class="form-control" placeholder="Digite a idade">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Sexo</label>
                    <select class="form-select">
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Sinais Vitais -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Sinais Vitais
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3 mb-3">
                    <label class="form-label">Pressão Arterial</label>
                    <input type="text" class="form-control" placeholder="Ex: 120/80">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Frequência Cardíaca</label>
                    <input type="number" class="form-control" placeholder="bpm">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Temperatura</label>
                    <input type="text" class="form-control" placeholder="°C">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Saturação O2</label>
                    <input type="text" class="form-control" placeholder="%">
                </div>
            </div>
        </div>
    </div>

    <!-- Evolução -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Evolução do Paciente
        </div>
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Descrição</label>
                <textarea class="form-control" rows="4" placeholder="Descreva a evolução do paciente"></textarea>
            </div>
        </div>
    </div>

    <!-- Medicação -->
    <div class="card mb-4">
        <div class="card-header bg-info text-white text-center">
            Medicação
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Medicamento</label>
                    <input type="text" class="form-control" placeholder="Nome do medicamento">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Dosagem</label>
                    <input type="text" class="form-control" placeholder="Ex: 500mg">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">Frequência</label>
                    <input type="text" class="form-control" placeholder="Ex: 2x ao dia">
                </div>
            </div>
        </div>
    </div>

    <!-- Botão -->
    <div class="text-end mb-5">
        <button class="btn btn-primary" type="submit">Salvar Prontuário</button>
    </div>

</form>
</div>

</body>
</html>
