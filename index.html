<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário Eletrônico</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container-fluid justify-content-center">
        <span class="navbar-brand mb-0 h1">
            <i class="bi bi-hospital"></i> Prontuário Eletrônico
        </span>
    </div>
</nav>

<div class="container mt-4">
<form onsubmit="mostrarDados(); return false;">

    <!-- Dados do Paciente -->
    <div class="card mb-4 shadow-sm rounded-4">
        <div class="card-header bg-primary text-white text-center fw-bold">
            <i class="bi bi-person"></i> Dados do Paciente
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nome</label>
                    <input id="nome" type="text" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Idade</label>
                    <input id="idade" type="text" class="form-control">
                </div>

                <div class="col-md-3 mb-3">
                    <label>Sexo</label>
                    <select id="sexo" class="form-select">
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Outro</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Sinais Vitais -->
    <div class="card mb-4 shadow-sm rounded-4">
        <div class="card-header bg-danger text-white text-center fw-bold">
            <i class="bi bi-heart-pulse"></i> Sinais Vitais
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-3">
                    <label>Pressão</label>
                    <input id="pressao" type="text" class="form-control" placeholder="Ex. 120/80">
                </div>
                <div class="col-md-3">
                    <label>Frequência</label>
                    <input id="frequencia" type="number" class="form-control">
                </div>
                <div class="col-md-3">
                    <label>Temperatura</label>
                    <input id="temperatura" type="text" class="form-control" placeholder="Ex. 36°C">
                </div>
                <div class="col-md-3">
                    <label>Saturação</label>
                    <input id="saturacao" type="text" class="form-control" placeholder="Ex. 90%">
                </div>
            </div>
        </div>
    </div>

    <!-- Evolução -->
    <div class="card mb-4 shadow-sm rounded-4">
        <div class="card-header bg-warning text-dark text-center fw-bold">
            <i class="bi bi-journal-text"></i> Evolução do Paciente
        </div>
        <div class="card-body">
            <textarea id="evolucao" class="form-control" rows="4"></textarea>
        </div>
    </div>

    <!-- Medicação -->
    <div class="card mb-4 shadow-sm rounded-4">
        <div class="card-header bg-success text-white text-center fw-bold">
            <i class="bi bi-capsule"></i> Medicação
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <label>Medicamento</label>
                    <input id="medicamento" type="text" class="form-control">
                </div>
                <div class="col-md-4">
                    <label>Dosagem</label>
                    <input id="dosagem" type="text" class="form-control">
                </div>
                <div class="col-md-4">
                    <label>Horário</label>
                    <input id="horario" type="text" class="form-control">
                </div>
            </div>
        </div>
    </div>

    <!-- Botão -->
    <div class="text-end mb-5">
        <button class="btn btn-success btn-lg shadow">
            <i class="bi bi-save"></i> Salvar Prontuário 
        </button>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="card shadow d-none">
        <div class="card-header bg-dark text-white">
            Resultado Prontuário
        </div>
        <div class="card-body"></div>
    </div>

</form>
</div>

<!-- Toast -->
<div class="toast position-fixed bottom-0 end-0 p-3" id="toastSucesso">
    <div class="toast-header">
        <strong class="me-auto">Sistema</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
        Prontuário salvo com sucesso!
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function mostrarDados() {
    let nome = document.getElementById("nome").value;
    let idade = document.getElementById("idade").value;
    let sexo = document.getElementById("sexo").value;
    let pressao = document.getElementById("pressao").value;
    let frequencia = document.getElementById("frequencia").value;
    let temperatura = document.getElementById("temperatura").value;
    let saturacao = document.getElementById("saturacao").value;
    let evolucao = document.getElementById("evolucao").value;
    let medicamento = document.getElementById("medicamento").value;
    let dosagem = document.getElementById("dosagem").value;
    let horario = document.getElementById("horario").value;

    let resultado = `
       <ul class="list-group">
        <li class="list-group-item"><strong>Nome:</strong> ${nome}</li>
        <li class="list-group-item"><strong>Idade:</strong> ${idade}</li>
        <li class="list-group-item"><strong>Sexo:</strong> ${sexo}</li>
        <li class="list-group-item"><strong>Pressão:</strong> ${pressao}</li>
        <li class="list-group-item"><strong>Frequência:</strong> ${frequencia}</li>
        <li class="list-group-item"><strong>Temperatura:</strong> ${temperatura}</li>
        <li class="list-group-item"><strong>Saturação:</strong> ${saturacao}</li>
        <li class="list-group-item"><strong>Evolução:</strong> ${evolucao}</li>
        <li class="list-group-item"><strong>Medicamento:</strong> ${medicamento}</li>
        <li class="list-group-item"><strong>Dosagem:</strong> ${dosagem}</li>
        <li class="list-group-item"><strong>Horário:</strong> ${horario}</li>
       </ul>
    `;

    let caixa = document.getElementById("resultado");
    caixa.querySelector(".card-body").innerHTML = resultado;
    caixa.classList.remove("d-none");

    let toast = new bootstrap.Toast(document.getElementById('toastSucesso'));
    toast.show();
}
</script>

</body>
</html>
